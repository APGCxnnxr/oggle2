<div id="gp-status" style="position:fixed;right:8px;top:8px;padding:6px 10px;background:#222;color:#fff;border-radius:6px;font-family:monospace;z-index:9999">No controller</div>

<script>
  (function(){
    const CDN_BASE = 'https://cdn.jsdelivr.net/gh/APGCxnnxr/oggle2@add-gamepad-support/';
    function addScript(src, onload, onerror){
      const s = document.createElement('script'); s.src = src; s.async = false;
      if (onload) s.addEventListener('load', onload);
      if (onerror) s.addEventListener('error', onerror);
      document.head.appendChild(s);
    }

    // Try local first
    addScript('gamepad.js', function(){
      // local gamepad loaded — now try local init
      addScript('gamepad-init.js', function(){ /* local init loaded */ }, function(){
        // local init failed -> fallback init from CDN
        addScript(CDN_BASE + 'gamepad-init.js');
      });
    }, function(){
      // local gamepad failed -> load gamepad from CDN, then init from CDN
      addScript(CDN_BASE + 'gamepad.js', function(){
        addScript(CDN_BASE + 'gamepad-init.js');
      }, function(){
        console.warn('Gamepad scripts failed to load (both local and CDN).');
      });
    });
  })();
</script>
